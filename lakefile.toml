name = "leetcode_rust_lean"

# The root project only pins the shared dependencies: `lake exe cache get && lake build Aeneas`
# here fetches and builds them once. Every program under programs/ is its own small Lake project;
# tools/check.py mounts these packages into it, and tools/new_proof.py links them for editors.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "0c19cd5bff9298565362c6ca9c4f48a29033a0e9"
subDir = "backends/lean"
