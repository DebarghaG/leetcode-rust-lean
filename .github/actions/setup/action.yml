name: Set up Lean, Mathlib and Aeneas
description: elan, bubblewrap, and the shared packages in .lake/packages (cached)
inputs:
  save-cache:
    description: save the package cache (only the main branch does)
    default: "false"
runs:
  using: composite
  steps:
    - name: Make room on the runner
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h / | tail -1
    - name: Install elan and bubblewrap
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
        # lake comparator sandboxes with bwrap, which needs unprivileged user namespaces
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Restore the shared packages
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: .lake
        key: lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-v2
    - name: Fetch Mathlib and build Aeneas
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        lake exe cache get
        rm -rf ~/.cache/mathlib
        lake build Aeneas
        df -h / | tail -1
    - name: Save the shared packages
      if: steps.restore.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: .lake
        key: lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-v2
