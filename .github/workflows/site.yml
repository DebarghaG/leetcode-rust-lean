name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      # The results live in this branch's Actions cache, which only runs on main can write.
      - name: Restore earlier results
        uses: actions/cache/restore@v4
        with:
          path: status
          key: status-${{ github.run_id }}
          restore-keys: status-
      - name: Check every proof without a current result
        run: python3 tools/verify_all.py --limit-minutes 240
      - name: Save the results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: status
          key: status-${{ github.run_id }}
      - name: Build the site data
        run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
