<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Rust-to-Lean: proof progress</title>
<meta name="description" content="24,617 theorems about 2,124 real programs, translated from Rust to Lean 4. Proofs are checked by lake comparator.">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header id="bar">
  <a id="brand" href="#/">LeetCode <span>Rust-to-Lean</span></a>
  <nav>
    <a href="#/" data-v="map">Map</a>
    <a href="#/theorems" data-v="theorems">Theorems</a>
    <a href="#/contribute" data-v="contribute">Contribute</a>
  </nav>
  <div id="searchwrap">
    <input id="search" type="search" placeholder="Search programs  ( / )" autocomplete="off" spellcheck="false">
    <div id="results" hidden></div>
  </div>
  <button id="theme" title="Light / dark">◐</button>
</header>
<main id="main">
  <section id="view"></section>
  <aside id="side" hidden><button id="close" title="Close (Esc)">×</button><div id="insp"></div></aside>
</main>
<div id="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
